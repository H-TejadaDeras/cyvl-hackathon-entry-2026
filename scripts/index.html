    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Stormwater Risk Intelligence - Dashboard</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg: #0f172a;
                --panel: #1e293b;
                --text: #f8fafc;
                --accent: #38bdf8;
                --accent-hover: #0ea5e9;
            }
            body {
                margin: 0; padding: 0; font-family: 'Inter', sans-serif;
                background-color: var(--bg); color: var(--text);
                display: flex; flex-direction: column; min-height: 100vh;
                overflow-x: hidden;
            }
            header {
                padding: 20px 40px; background: rgba(30, 41, 59, 0.8);
                backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1);
                display: flex; justify-content: space-between; align-items: center;
            }
            h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
            .stats { font-size: 18px; font-weight: 600; color: var(--accent); }
            
            .tabs {
                display: flex; justify-content: center; gap: 20px; padding: 20px;
            }
            .tab-btn {
                background: var(--panel); border: 1px solid rgba(255,255,255,0.1);
                color: var(--text); padding: 12px 24px; border-radius: 8px;
                font-size: 16px; font-weight: 600; cursor: pointer;
                transition: all 0.2s ease;
            }
            .tab-btn:hover { border-color: var(--accent); }
            .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4); }
            
            .content-area {
                flex: 1; display: flex; justify-content: center; align-items: flex-start;
                padding: 20px; position: relative; overflow-y: auto;
            }
            .tab-content {
                width: 100%; min-height: 80vh; display: none;
                background: var(--panel); border-radius: 16px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05);
                overflow: visible; animation: fadeIn 0.4s ease forwards;
            }
            .tab-content.active { display: flex; justify-content: center; align-items: flex-start; }
            
            #tab-cyvl img { width: 100%; height: auto; display: block; border-radius: 16px; }
            
            @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        </style>
